  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
      
      /* Mencegah seleksi/blok teks */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwoGxJO7wkgwSQYHZEN6m4RwFvXjlvEgfPtZdQXxgxZKhEXBPEkLdki0UggrBfeXCfIEw/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    // 1. Cegah Klik Kanan
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // 2. Cegah Shortcut Keyboard (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
    document.onkeydown = function(e) {
      // F12
      if (e.keyCode === 123) {
        return false;
      }
      // Ctrl+Shift+I (Inspect) atau Ctrl+Shift+J (Console)
      if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) {
        return false;
      }
      // Ctrl+U (View Source)
      if (e.ctrlKey && e.keyCode === 85) {
        return false;
      }
      // Ctrl+S (Save) atau Ctrl+P (Print)
      if (e.ctrlKey && (e.keyCode === 83 || e.keyCode === 80)) {
        e.preventDefault();
        return false;
      }
    };
  </script>
</body>
